spring:
  config:
    activate:
      on-profile: db

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${SUPABASE_DB_SSL_MODE:require}
    username: ${SUPABASE_DB_USER:postgres.xebtefsablyalzvzyhpt}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      pool-name: SupabaseHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY:disabled-kakao-client}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: https://www.googleapis.com/auth/userinfo.profile, https://www.googleapis.com/auth/userinfo.email
            client-name: Google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            # 기존 Google 세션이 있어도 로그인할 계정을 매번 선택하도록 한다.
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    community-db-support-enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: false

  ai:
    model:
      # Google GenAI 자동 설정은 모델 값이 없으면 기본 활성화된다.
      # 일반 실행에서는 명시적으로 비활성화하고 ai-google 프로필에서만 덮어쓴다.
      chat: none

  autoconfigure:
    exclude:
      # 기본 db 프로필은 AI 모델을 요구하지 않는다. AI는 ai-google 프로필에서만 활성화한다.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

app:
  oauth:
    kakao:
      enabled: ${KAKAO_LOGIN_ENABLED:false}
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}

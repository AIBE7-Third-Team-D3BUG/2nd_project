<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프로필 수정 | D3BUG</title>
    <link rel="stylesheet" href="../static/css/account.css" th:href="@{/css/account.css}">
</head>
<body>
<header class="account-header">
    <a class="brand" th:href="@{/}">D3BUG</a>
    <nav class="account-nav" aria-label="주요 메뉴">
        <a th:href="@{/}">업무 찾기</a>
        <a class="active" th:href="@{/profile}">내 프로필</a>
    </nav>
</header>
<main class="profile-main edit-profile-main">
    <section class="card profile-edit-card">
        <p class="eyebrow">PROFILE · 기본 정보</p>
        <h1>마이프로필 수정</h1>
        <p class="subtitle">수행자 추천과 공개 프로필에 표시할 정보를 관리합니다.</p>
        <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="errors" th:if="${#fields.hasGlobalErrors()}"><div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div></div>
            <div class="profile-image-field">
                <div class="avatar profile-photo image-preview">
                    <img id="profile-image-preview" th:if="${profile.hasProfileImage()}"
                         th:src="@{/members/{id}/image(id=${profile.id()})}" alt="현재 프로필 사진">
                    <span id="profile-image-fallback" th:classappend="${profile.hasProfileImage()} ? ' hidden'"
                          th:text="${#strings.substring(profile.nickname(), 0, 1)}">T</span>
                </div>
                <div>
                    <label class="file-button" for="profileImage">프로필 사진 변경</label>
                    <input class="visually-hidden" id="profileImage" name="profileImage" type="file" accept="image/jpeg,image/png,image/webp">
                    <p class="field-help">JPG, PNG, WEBP · 최대 3MB</p>
                    <label class="checkbox remove-photo" th:if="${profile.hasProfileImage()}">
                        <input id="removeProfileImage" type="checkbox" th:field="*{removeProfileImage}"><span>현재 사진 삭제</span>
                    </label>
                </div>
            </div>
            <div class="field"><label for="nickname">닉네임</label><input id="nickname" type="text" th:field="*{nickname}" maxlength="20" required><div class="field-error" th:errors="*{nickname}"></div></div>
            <div class="field"><label for="introduction">자기소개</label><textarea id="introduction" th:field="*{introduction}" maxlength="1000" placeholder="어떤 도움을 줄 수 있는지 소개해주세요."></textarea><div class="field-error" th:errors="*{introduction}"></div></div>
            <div class="field"><label for="skillTags">기술 태그</label><input id="skillTags" type="text" th:field="*{skillTags}" maxlength="599" placeholder="Java, Spring Boot, Figma"><div class="field-help">쉼표로 구분해 최대 10개까지 입력할 수 있습니다.</div><div class="field-error" th:errors="*{skillTags}"></div><div class="field-error" th:errors="*{skillTagsValid}"></div></div>
            <div class="field"><label for="portfolioUrl">포트폴리오 URL</label><input id="portfolioUrl" type="url" th:field="*{portfolioUrl}" maxlength="1000" placeholder="https://"><div class="field-error" th:errors="*{portfolioUrl}"></div><div class="field-error" th:errors="*{portfolioUrlValid}"></div></div>
            <label class="checkbox"><input type="checkbox" th:field="*{notificationEnabled}"><span>긴급 업무 추천 알림 받기</span></label>
            <div class="edit-profile-actions"><a class="cancel-button" th:href="@{/profile}">취소</a><button class="primary-button" type="submit">프로필 저장</button></div>
        </form>
    </section>
</main>
<script>
    const imageInput = document.getElementById("profileImage");
    let preview = document.getElementById("profile-image-preview");
    const fallback = document.getElementById("profile-image-fallback");
    const removeCheckbox = document.getElementById("removeProfileImage");
    imageInput.addEventListener("change", function () {
        const file = imageInput.files && imageInput.files[0];
        if (!file) return;
        if (!preview) {
            preview = document.createElement("img");
            preview.id = "profile-image-preview";
            preview.alt = "선택한 프로필 사진 미리보기";
            document.querySelector(".image-preview").prepend(preview);
        }
        preview.src = URL.createObjectURL(file);
        fallback.classList.add("hidden");
        if (removeCheckbox) removeCheckbox.checked = false;
    });
</script>
</body>
</html>

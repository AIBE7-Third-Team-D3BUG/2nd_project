<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | D3BUG</title>
    <link rel="stylesheet" href="../static/css/account.css" th:href="@{/css/account.css}">
<link rel="icon" type="image/png" href="/images/barohae-logo-check.png" th:href="@{/images/barohae-logo-check.png}"></head>
<body>
<header class="account-header">
    <a class="brand" th:href="@{/}"><img src="/images/barohae-logo-check.png" th:src="@{/images/barohae-logo-check.png}" alt="바로해"></a>
    <nav class="account-nav" aria-label="주요 메뉴">
        <a th:href="@{/}">업무 찾기</a>
        <a th:href="@{/login}">로그인</a>
    </nav>
</header>
<main class="account-main">
    <section class="card">
        <p class="eyebrow">COMMON-01 · 로그인 / 회원가입</p>
        <h1>함께할 준비가 됐나요?</h1>
        <p class="subtitle">가입하면 바로 사용할 수 있는 4품이 지급됩니다.</p>
        <div class="auth-tabs" aria-label="계정 메뉴">
            <a th:href="@{/login}">로그인</a>
            <a class="active" th:href="@{/signup}">회원가입</a>
        </div>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post" autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="errors" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            </div>
            <div class="field">
                <label for="email">이메일</label>
                <input id="email" type="email" th:field="*{email}" maxlength="255" placeholder="example@email.com" autocomplete="email" required>
                <div class="field-error" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="nickname">닉네임</label>
                <input id="nickname" type="text" th:field="*{nickname}" maxlength="20" placeholder="서비스에서 사용할 이름" autocomplete="nickname" required>
                <div class="field-error" th:errors="*{nickname}"></div>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" type="password" th:field="*{password}" minlength="10" maxlength="72" placeholder="영문, 숫자, 특수문자 포함 10자 이상" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{password}"></div>
            </div>
            <div class="field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" maxlength="72" placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{passwordConfirm}"></div>
                <div class="field-error" th:errors="*{passwordConfirmed}"></div>
            </div>
            <label class="checkbox">
                <input type="checkbox" th:field="*{termsAgreed}">
                <span>서비스 이용약관에 동의합니다. (필수)</span>
            </label>
            <div class="field-error" th:errors="*{termsAgreed}"></div>
            <label class="checkbox">
                <input type="checkbox" th:field="*{privacyAgreed}">
                <span>개인정보 수집 및 이용에 동의합니다. (필수)</span>
            </label>
            <div class="field-error" th:errors="*{privacyAgreed}"></div>
            <button class="primary-button" type="submit">회원가입</button>
        </form>
        <div class="text-link">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></div>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${profile.nickname() + ' 프로필 | D3BUG'}">프로필 | D3BUG</title>
    <link rel="stylesheet" href="../static/css/account.css" th:href="@{/css/account.css}">
</head>
<body>
<header class="account-header">
    <a class="brand" th:href="@{/}">D3BUG</a>
    <nav class="account-nav" aria-label="주요 메뉴">
        <a th:href="@{/}">업무 찾기</a>
        <a th:href="@{/(view='dashboard')}">내 업무</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/chat}">채팅</a>
    </nav>
    <div class="header-actions">
        <a sec:authorize="isAnonymous()" class="header-link" th:href="@{/login}">로그인</a>
        <a sec:authorize="isAnonymous()" class="header-link" th:href="@{/signup}">회원가입</a>
        <a sec:authorize="isAuthenticated()" class="header-link" th:classappend="${isOwner} ? 'active'" th:href="@{/profile}">내 프로필</a>
    </div>
</header>
<main class="profile-main public-profile-main">
    <div class="profile-layout">
        <section class="card profile-overview-card">
            <p class="eyebrow" th:text="${isOwner} ? 'COMMON-04 · 내 프로필' : 'MEMBER · 공개 프로필'">COMMON-04 · 내 프로필</p>
            <div class="profile-overview">
                <div class="profile-person-block">
                    <div class="avatar profile-photo">
                        <img th:if="${profile.hasProfileImage()}" th:src="@{/members/{id}/image(id=${profile.id()})}" alt="프로필 사진">
                        <span th:unless="${profile.hasProfileImage()}" th:text="${#strings.substring(profile.nickname(), 0, 1)}">T</span>
                    </div>
                    <div class="identity-copy">
                        <h1 th:text="${profile.nickname()}">닉네임</h1>
                        <p class="profile-introduction"
                           th:text="${#strings.isEmpty(profile.introduction()) ? '아직 자기소개가 등록되지 않았습니다.' : profile.introduction()}">자기소개</p>
                        <div class="profile-tags" th:if="${!#lists.isEmpty(profile.skillTags())}">
                            <span th:each="tag : ${profile.skillTags()}" th:text="${tag}">Spring</span>
                        </div>
                        <a class="portfolio-link" th:if="${profile.portfolioUrl() != null}"
                           th:href="${profile.portfolioUrl()}" target="_blank" rel="noopener noreferrer">포트폴리오 보기</a>
                    </div>
                </div>
                <div class="profile-actions" th:if="${isOwner}">
                    <a class="availability" th:href="@{/profile/edit}">프로필 수정</a>
                    <form class="logout compact" th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">로그아웃</button>
                    </form>
                </div>
            </div>
        </section>

        <div class="alert alert-success" th:if="${isOwner and param.updated != null}">프로필이 저장되었습니다.</div>

        <section class="profile-metrics" th:classappend="${!isOwner} ? ' public-metrics'" aria-label="프로필 활동 통계">
            <div class="metric-card"><span>완료한 업무</span><strong><span th:text="${profile.completedTaskCount()}">0</span>건</strong></div>
            <div class="metric-card"><span>평균 리뷰</span><strong th:text="${#numbers.formatDecimal(profile.averageRating(), 1, 1)}">0.0</strong></div>
            <div class="metric-card">
                <span th:text="${isOwner} ? '사용 가능' : '받은 후기'">사용 가능</span>
                <strong th:if="${isOwner}"><span th:text="${profile.availablePum()}">0</span>품</strong>
                <strong th:unless="${isOwner}"><span th:text="${profile.reviewCount()}">0</span>건</strong>
            </div>
            <div class="metric-card" th:if="${isOwner}"><span>업무 예약 중</span><strong><span th:text="${profile.reservedPum()}">0</span>품</strong></div>
        </section>
    </div>
</main>
</body>
</html>

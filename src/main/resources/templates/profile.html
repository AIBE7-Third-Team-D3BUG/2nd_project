<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마이프로필 | D3BUG</title>
    <link rel="stylesheet" href="../static/css/account.css" th:href="@{/css/account.css}">
</head>
<body>
<header class="account-header">
    <a class="brand" th:href="@{/}">D3BUG</a>
    <nav class="account-nav" aria-label="주요 메뉴">
        <a th:href="@{/}">업무 찾기</a>
        <a class="active" th:href="@{/profile}">내 프로필</a>
    </nav>
</header>
<main class="profile-main">
    <div class="profile-grid">
        <aside class="card summary-card">
            <p class="eyebrow">COMMON-04 · 프로필</p>
            <div class="profile-identity">
                <div class="avatar" th:text="${#strings.substring(profile.nickname(), 0, 1)}">T</div>
                <div class="identity-copy">
                    <h2 th:text="${profile.nickname()}">닉네임</h2>
                    <p class="email" th:text="${profile.email()}">email@example.com</p>
                </div>
            </div>
            <div class="balance">
                <span>사용 가능한 시간</span>
                <strong><span th:text="${profile.availablePum()}">4</span>품</strong>
                <small><span th:text="${profile.availableMinutes()}">120</span>분</small>
            </div>
            <div class="stats">
                <div class="stat">완료 업무<strong th:text="${profile.completedTaskCount()}">0</strong></div>
                <div class="stat">평균 평점<strong th:text="${#numbers.formatDecimal(profile.averageRating(), 1, 1)}">0.0</strong></div>
                <div class="stat">후기<strong th:text="${profile.reviewCount()}">0</strong></div>
                <div class="stat">예약 시간<strong><span th:text="${profile.reservedPum()}">0</span>품</strong></div>
            </div>
            <form class="logout" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">로그아웃</button>
            </form>
        </aside>

        <section class="card">
            <p class="eyebrow">PROFILE · 기본 정보</p>
            <h1>마이프로필</h1>
            <p class="subtitle">수행자 추천에 활용되는 정보를 관리합니다.</p>
            <div class="alert alert-success" th:if="${param.updated}">프로필이 저장되었습니다.</div>
            <form th:action="@{/profile}" th:object="${profileForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="errors" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                </div>
                <div class="field">
                    <label for="nickname">닉네임</label>
                    <input id="nickname" type="text" th:field="*{nickname}" maxlength="20" required>
                    <div class="field-error" th:errors="*{nickname}"></div>
                </div>
                <div class="field">
                    <label for="introduction">자기소개</label>
                    <textarea id="introduction" th:field="*{introduction}" maxlength="1000" placeholder="어떤 도움을 줄 수 있는지 소개해주세요."></textarea>
                    <div class="field-error" th:errors="*{introduction}"></div>
                </div>
                <div class="field">
                    <label for="skillTags">기술 태그</label>
                    <input id="skillTags" type="text" th:field="*{skillTags}" maxlength="599" placeholder="Java, Spring Boot, Figma">
                    <div class="field-help">쉼표로 구분해 최대 10개까지 입력할 수 있습니다.</div>
                    <div class="field-error" th:errors="*{skillTags}"></div>
                    <div class="field-error" th:errors="*{skillTagsValid}"></div>
                </div>
                <div class="field">
                    <label for="portfolioUrl">포트폴리오 URL</label>
                    <input id="portfolioUrl" type="url" th:field="*{portfolioUrl}" maxlength="1000" placeholder="https://">
                    <div class="field-error" th:errors="*{portfolioUrl}"></div>
                    <div class="field-error" th:errors="*{portfolioUrlValid}"></div>
                </div>
                <label class="checkbox">
                    <input type="checkbox" th:field="*{notificationEnabled}">
                    <span>긴급 업무 추천 알림 받기</span>
                </label>
                <button class="primary-button" type="submit">프로필 저장</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>

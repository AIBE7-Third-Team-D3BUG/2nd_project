<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>요청을 처리하지 못했습니다 | BaroHae</title>
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
</head>
<body>
<main class="error-page">
    <p class="eyebrow">ERROR <span th:text="${status}">500</span></p>
    <h1 th:if="${status == 404}">요청한 페이지를 찾을 수 없습니다.</h1>
    <h1 th:if="${status == 403}">이 페이지에 접근할 권한이 없습니다.</h1>
    <h1 th:if="${status != 404 and status != 403}">요청을 처리하지 못했습니다.</h1>
    <p th:if="${status == 404}">주소가 변경되었거나 삭제된 자료일 수 있습니다.</p>
    <p th:if="${status == 403}">로그인 상태와 이용 권한을 확인한 뒤 다시 시도해주세요.</p>
    <p th:if="${status != 404 and status != 403}">잠시 후 다시 시도해주세요. 문제가 계속되면 운영자에게 문의해주세요.</p>
    <div class="error-page-actions">
        <a class="button" th:href="@{/}">업무 목록으로 이동</a>
        <a class="button secondary-button" href="javascript:history.back()">이전 페이지로</a>
    </div>
</main>
</body>
</html>

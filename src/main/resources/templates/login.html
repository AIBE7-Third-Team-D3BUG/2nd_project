<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | BaroHae</title>
    <link rel="stylesheet" href="../static/css/account.css" th:href="@{/css/account.css}">
<link rel="icon" type="image/png" href="/images/barohae-logo-check.png" th:href="@{/images/barohae-logo-check.png}"></head>
<body>
<header class="account-header">
    <a class="brand" th:href="@{/}"><img src="/images/barohae-logo-check.png" th:src="@{/images/barohae-logo-check.png}" alt="바로해"></a>
    <nav class="account-nav" aria-label="주요 메뉴">
        <a th:href="@{/}">업무 찾기</a>
        <a th:href="@{/signup}">회원가입</a>
    </nav>
</header>
<main class="account-main">
    <section class="card">
        <p class="eyebrow">BaroHae · 로그인 / 회원가입</p>
        <h1>다시 만나서 반가워요</h1>
        <p class="subtitle">급한 일을 빠르고, 정확하게 바로하다.</p>
        <div class="auth-tabs" aria-label="계정 메뉴">
            <a class="active" th:href="@{/login}">로그인</a>
            <a th:href="@{/signup}">회원가입</a>
        </div>
        <div class="alert alert-success" th:if="${param.registered}">가입이 완료되었습니다. 로그인해주세요.</div>
        <div class="alert alert-success" th:if="${param.logout}">안전하게 로그아웃되었습니다.</div>
        <div class="alert alert-error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</div>
        <div class="alert alert-error" th:if="${param.suspended}">정지된 계정입니다.</div>
        <div class="alert alert-error" th:if="${param.blocked}">로그인 시도가 너무 많습니다. 15분 후 다시 시도해주세요.</div>
        <div class="alert alert-error" th:if="${param.socialError}">소셜 로그인에 실패했습니다. 이메일 제공 동의와 앱 설정을 확인해주세요.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" maxlength="255" placeholder="example@email.com" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" maxlength="72" placeholder="8자 이상 입력" autocomplete="current-password" required>
            </div>
            <button class="primary-button" type="submit">로그인</button>
        </form>
        <div th:if="${kakaoLoginEnabled}">
            <div class="social-login-divider"><span>또는</span></div>
            <a class="kakao-login-button" th:href="@{/oauth2/authorization/kakao}">
                <svg class="kakao-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 2.5C6.2 2.5 1.5 6.2 1.5 10.8c0 3 2 5.7 5.1 7.1l-1.1 3.7c-.1.5.4.8.8.5l4.3-2.8c.5.1 1 .1 1.4.1 5.8 0 10.5-3.7 10.5-8.3S17.8 2.5 12 2.5Z"/>
                    <text x="12" y="13.2" text-anchor="middle">TALK</text>
                </svg>
                <span>카카오로 시작하기</span>
            </a>
        </div>
        <a class="google-login-button" th:if="${googleLoginEnabled}" th:href="@{/oauth2/authorization/google}">
            <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="#4285f4" d="M21.8 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.5a4.7 4.7 0 0 1-2 3.1v2.3h3.2c1.9-1.7 3.1-4.3 3.1-7.1Z"/>
                <path fill="#34a853" d="M12 22c2.7 0 5-.9 6.7-2.6l-3.2-2.3c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H2.9V16A10 10 0 0 0 12 22Z"/>
                <path fill="#fbbc05" d="M6.2 13.7A6 6 0 0 1 5.9 12c0-.6.1-1.2.3-1.7V8H2.9A10 10 0 0 0 2 12c0 1.4.3 2.7.9 4l3.3-2.3Z"/>
                <path fill="#ea4335" d="M12 6c1.5 0 2.9.5 3.9 1.5l2.9-2.9C17 2.9 14.7 2 12 2A10 10 0 0 0 2.9 8l3.3 2.3C7 7.8 9.3 6 12 6Z"/>
            </svg>
            <span>Google로 시작하기</span>
        </a>
        <div class="text-link">비밀번호를 잊으셨나요?</div>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>채팅 상세 | D3BUG ADMIN</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-monitoring.css}"></head>
<body><div class="admin-shell">
<header class="admin-header"><a class="brand" th:href="@{/admin}">D3BUG <span>ADMIN</span></a><nav><a th:href="@{/admin}">대시보드</a><a class="active" th:href="@{/admin/chats}">채팅 로그</a></nav><div class="header-actions"><a th:href="@{/admin/chats}">목록으로</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">로그아웃</button></form></div></header>
<main><div class="page-heading"><p th:text="|CHAT ROOM #${chat.roomId()}|">CHAT ROOM</p><h1 th:text="${chat.taskTitle()}">업무 채팅</h1><span th:text="|업무 #${chat.taskId()} · 의뢰인 ${chat.requesterName()} · 작업자 ${chat.workerName()} · 총 ${chat.messageCount()}건|">참여자</span></div>
<div class="privacy-warning">관리자 열람 기록은 운영 목적에 한해 사용하세요. 블라인드는 이용자 화면에서 본문과 첨부를 숨기며 원본은 감사·분쟁 대응을 위해 보존합니다.</div>
<div class="notice success" th:if="${adminMessage}" th:text="${adminMessage}"></div><div class="notice error" th:if="${adminError}" th:text="${adminError}"></div>
<section class="admin-card chat-log"><article class="admin-message" th:each="message : ${chat.messages()}" th:classappend="${message.moderated() ? ' moderated' : ''}"><div class="message-head"><div><strong th:text="${message.senderName()}">발신자</strong><span th:text="|메시지 #${message.id()}|">#1</span></div><div><time th:text="${message.sentAtLabel()}">-</time><span class="pill success" th:if="${message.readAtLabel() != '-'}" th:text="|읽음 ${message.readAtLabel()}|">읽음</span><span class="pill" th:unless="${message.readAtLabel() != '-'}">안 읽음</span></div></div>
<p class="message-content" th:text="${message.content() ?: '(첨부 파일만 전송)'}">내용</p><a class="attachment-box" th:if="${message.hasAttachment()}" th:href="@{/admin/chat-messages/{id}/attachment(id=${message.id()})}" target="_blank"><strong th:text="${message.attachmentName()}">파일</strong><span th:text="${message.attachmentSize() == null ? '' : #numbers.formatDecimal(message.attachmentSize() / 1024.0, 1, 1) + ' KB'}">크기</span></a>
<div class="moderation-state" th:if="${message.moderated()}"><strong>블라인드 처리됨</strong><span th:text="|${message.moderatedAtLabel()} · ${message.moderationReason()}|">처리 사유</span></div>
<details class="moderation-control"><summary th:text="${message.moderated() ? '블라인드 해제' : '메시지 관리'}">관리</summary><form class="stack-form moderation-form" th:action="${message.moderated()} ? @{/admin/chat-messages/{id}/restore(id=${message.id()})} : @{/admin/chat-messages/{id}/blind(id=${message.id()})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="roomId" th:value="${chat.roomId()}"><input name="reason" maxlength="450" th:placeholder="${message.moderated() ? '복원 사유' : '블라인드 사유'}" required><button th:classappend="${message.moderated() ? ' secondary' : ' danger-button'}" type="submit" th:text="${message.moderated() ? '메시지 복원' : '본문·첨부 블라인드'}">처리</button></form></details></article>
<p class="empty" th:if="${#lists.isEmpty(chat.messages())}">메시지가 없습니다.</p></section></main></div><script>document.querySelectorAll('.moderation-form').forEach((form)=>form.addEventListener('submit',(event)=>{if(!window.confirm('이 관리자 조치는 감사 기록에 저장됩니다. 계속할까요?'))event.preventDefault();}));</script></body></html>

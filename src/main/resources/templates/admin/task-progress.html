<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>업무 진행상황 | D3BUG ADMIN</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-monitoring.css}"><link rel="icon" type="image/png" href="/images/barohae-logo-check.png" th:href="@{/images/barohae-logo-check.png}"></head>
<body><div class="admin-shell">
<header class="admin-header"><a class="brand" th:href="@{/admin}"><img src="/images/barohae-logo-check.png" th:src="@{/images/barohae-logo-check.png}" alt="바로해"><span>ADMIN</span></a><nav><a th:href="@{/admin}">대시보드</a><a th:href="@{/admin/chats}">채팅 로그</a></nav><div class="header-actions"><a th:href="@{/admin}">업무 목록으로</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">로그아웃</button></form></div></header>
<main><div class="page-heading"><p th:text="|TASK MONITORING #${progress.taskId()}|">TASK</p><h1 th:text="${progress.title()}">업무 제목</h1><span th:text="|${progress.requesterName()} → ${progress.workerName()} · ${progress.requestedPum()}품 · ${progress.category()}|">업무 정보</span></div>
<section class="progress-summary"><article><span>현재 상태</span><strong th:text="${progress.statusLabel()}">진행 중</strong><small th:text="${progress.statusCode()}">IN_PROGRESS</small></article><article th:classappend="${progress.overdue() ? ' overdue' : ''}"><span>마감</span><strong th:text="${progress.deadlineLabel()}">-</strong><small th:text="${progress.overdue() ? '마감 기한 경과' : '기한 내 진행'}">기한</small></article><article><span>채팅</span><strong th:text="|${progress.messageCount()}건|">0건</strong><a th:if="${progress.chatRoomId() != null}" th:href="@{/admin/chats/{id}(id=${progress.chatRoomId()})}">채팅 로그 확인</a><small th:unless="${progress.chatRoomId() != null}">채팅방 없음</small></article></section>
<section class="admin-card"><div class="section-heading"><div><p>ACTIVITY</p><h2>진행 타임라인</h2></div><span>한국 표준시</span></div><div class="admin-timeline"><article th:each="item : ${progress.timeline()}" th:classappend="${item.completed() ? ' completed' : ''} + ${item.current() ? ' current' : ''}"><i></i><div><strong th:text="${item.step()}">단계</strong><span th:text="${item.timeLabel()}">-</span></div></article></div></section>
<div class="monitor-grid"><section class="admin-card"><div class="section-heading"><div><p>SUBMISSION</p><h2>결과 제출</h2></div></div><div th:if="${progress.submission() != null}" class="detail-stack"><label>제출 내용</label><p th:text="${progress.submission().resultDescription()}">결과</p><dl><div><dt>실제 작업량</dt><dd th:text="|${progress.submission().actualPum()}품|">0품</dd></div><div><dt>결과 파일</dt><dd th:text="${progress.submission().hasResultFile() ? '등록됨' : '없음'}">없음</dd></div><div><dt>최초 제출</dt><dd th:text="${progress.submission().createdAtLabel()}">-</dd></div><div><dt>최근 수정</dt><dd th:text="${progress.submission().updatedAtLabel()}">-</dd></div></dl><div th:if="${progress.submission().requesterNote() != null}"><label>수정 요청</label><p th:text="${progress.submission().requesterNote()}">요청</p></div></div><p class="empty" th:if="${progress.submission() == null}">아직 제출된 결과가 없습니다.</p></section>
<section class="admin-card"><div class="section-heading"><div><p>REVIEW / DISPUTE</p><h2>검토 상태</h2></div></div><div class="detail-stack" th:if="${progress.dispute() != null}"><span class="pill danger" th:text="${progress.dispute().status()}">OPEN</span><label>신고자</label><p th:text="${progress.dispute().openedBy()}">회원</p><label>신고 내용</label><p th:text="${progress.dispute().description()}">내용</p><label th:if="${progress.dispute().resolutionNote() != null}">처리 결과</label><p th:if="${progress.dispute().resolutionNote() != null}" th:text="${progress.dispute().resolutionNote()}">결과</p><small th:text="|접수 ${progress.dispute().createdAtLabel()} · 처리 ${progress.dispute().resolvedAtLabel()}|">시각</small></div><div class="detail-stack" th:if="${progress.dispute() == null and progress.review() != null}"><strong th:text="|평점 ${progress.review().rating()} / 5|">평점</strong><p th:text="${progress.review().content() ?: '리뷰 내용 없음'}">리뷰</p><small th:text="|기한 준수 ${progress.review().deadlineMet() == true ? '예' : '아니오'} · ${progress.review().createdAtLabel()}|">정보</small></div><p class="empty" th:if="${progress.dispute() == null and progress.review() == null}">등록된 분쟁이나 리뷰가 없습니다.</p></section></div>
</main></div></body></html>

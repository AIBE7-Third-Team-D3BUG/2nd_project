<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>채팅 로그 | D3BUG ADMIN</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-monitoring.css}"><link rel="stylesheet" th:href="@{/css/admin-pagination.css}"><link rel="icon" type="image/png" href="/images/barohae-logo-check.png" th:href="@{/images/barohae-logo-check.png}"></head>
<body><div class="admin-shell">
<header class="admin-header"><a class="brand" th:href="@{/admin}"><img src="/images/barohae-logo-check.png" th:src="@{/images/barohae-logo-check.png}" alt="바로해"><span>ADMIN</span></a><nav><a th:href="@{/admin(q=${adminSearch},date=${adminDate})}">대시보드</a><a class="active" th:href="@{/admin/chats(q=${adminSearch},date=${adminDate})}">채팅 로그</a></nav><div class="header-actions"><a th:href="@{/}">서비스 화면</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">로그아웃</button></form></div></header>
<main><div class="page-heading"><p>COMMUNICATION MONITORING</p><h1>채팅 로그</h1><span>분쟁 대응과 안전 운영을 위해 최근 채팅방 100개를 조회합니다.</span></div>
<section class="admin-card"><div class="section-heading"><div><p>CHAT ROOMS</p><h2>채팅방 목록</h2></div><span>최근 활동순</span></div><form class="admin-search" th:action="@{/admin/chats}" method="get"><input name="q" th:value="${adminSearch}" placeholder="유저 닉네임 또는 이메일 검색" maxlength="255"><input type="date" name="date" th:value="${adminDate}" aria-label="조회 날짜"><button type="submit">검색·분류</button><a th:if="${!#strings.isEmpty(adminSearch) or !#strings.isEmpty(adminDate)}" th:href="@{/admin/chats}">검색 초기화</a></form><div class="search-result" th:if="${!#strings.isEmpty(adminSearch) or !#strings.isEmpty(adminDate)}"><strong>채팅 검색 결과</strong><span>해당 회원과 최근 활동 날짜에 맞는 채팅방만 표시됩니다.</span></div><div class="table-scroll"><table><thead><tr><th>업무</th><th>참여자</th><th>메시지</th><th>최근 메시지</th><th>참여 상태</th><th>조회</th></tr></thead><tbody>
<tr th:each="room : ${chatList.rooms()}"><td><strong th:text="${room.taskTitle()}">업무</strong><small th:text="|업무 #${room.taskId()} · 방 #${room.id()}|">번호</small></td><td><strong th:text="|의뢰인 ${room.requesterName()}|">의뢰인</strong><small th:text="|작업자 ${room.workerName()}|">작업자</small></td><td th:text="|${room.messageCount()}건|">0건</td><td class="message-preview"><span th:text="${room.lastMessagePreview() ?: '대화 없음'}">최근 메시지</span><small th:text="${room.lastMessageAtLabel()}">-</small></td><td><span class="pill" th:classappend="${room.requesterLeft() ? 'danger' : 'success'}" th:text="${room.requesterLeft() ? '의뢰인 퇴장' : '의뢰인 참여'}">참여</span><span class="pill" th:classappend="${room.workerLeft() ? 'danger' : 'success'}" th:text="${room.workerLeft() ? '작업자 퇴장' : '작업자 참여'}">참여</span></td><td><a class="action-link" th:href="@{/admin/chats/{id}(id=${room.id()})}">로그 보기</a></td></tr>
<tr th:if="${#lists.isEmpty(chatList.rooms())}"><td colspan="6" class="empty">생성된 채팅방이 없습니다.</td></tr></tbody></table></div></section></main></div></body></html>

services:
  - type: web
    name: barohae
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: web,db,ai-google
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: JPA_DDL_AUTO
        value: none
      - key: DB_MAX_POOL_SIZE
        value: "3"
      - key: DB_MIN_IDLE
        value: "0"
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_SSL_MODE
        value: require
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: task-attachments
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_LOGIN_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_ENABLED
        value: "true"
